<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Pérola Doce</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Italiana&family=Cormorant+Garamond:wght@600;700&family=Poppins:wght@400;500&display=swap"
        rel="stylesheet"
    >

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- TELA DE BOAS-VINDAS -->
    <div class="boas-vindas" id="boasVindas">

        <div class="caixa-boas-vindas">

            <h2>Bem-vindo(a) à</h2>

            <div class="marca-boas-vindas">
                <img
                    src="img/logo-ostra.png"
                    alt=""
                >

                <span>Pérola Doce</span>
            </div>

            <p>Como podemos te chamar?</p>

            <input
                type="text"
                id="nomeCliente"
                placeholder="Digite seu nome"
                autocomplete="off"
            >

            <button id="entrarSite">
                Entrar
            </button>

            <p
                class="erro-nome"
                id="erroNome"
            ></p>

        </div>

    </div>


    <!-- CABEÇALHO -->
    <header class="cabecalho">

        <button
            class="botao-menu"
            id="botaoMenu"
            aria-label="Abrir menu"
        >
            ☰
        </button>


        <div class="nome-marca">

            <img
                src="img/logo-ostra.png"
                alt=""
                class="logo-perola"
            >

            <h1>Pérola Doce</h1>

        </div>


        <button
            class="botao-carrinho"
            id="botaoCarrinho"
            aria-label="Abrir carrinho"
        >

            <svg
                class="icone-carrinho"
                viewBox="0 0 24 24"
                aria-hidden="true"
            >
                <path
                    d="M3 3h2l2.4 11.2a2 2 0 0 0 2 1.6h7.8a2 2 0 0 0 2-1.6L21 7H6"
                ></path>

                <circle
                    cx="10"
                    cy="20"
                    r="1"
                ></circle>

                <circle
                    cx="18"
                    cy="20"
                    r="1"
                ></circle>
            </svg>

            <span id="contadorCarrinho">0</span>

        </button>

    </header>


    <!-- MENU -->
    <nav
        class="menu-mobile"
        id="menuMobile"
    >
        <a href="index.html">Início</a>
        <a href="produtos.html">Produtos</a>
        <a href="kit-festa.html">Monte seu Kit</a>
        <a href="lojas.html">Lojas</a>
        <a href="sobre.html">Sobre</a>
        <a href="creditos.html">Créditos</a>
    </nav>


    <!-- CONTEÚDO PRINCIPAL -->
    <main>

        <!-- SAUDAÇÃO -->
        <div class="saudacao-cliente">
            <p id="saudacaoCliente"></p>
        </div>


        <!-- APRESENTAÇÃO -->
        <section class="apresentacao">

            <img
                src="img/img-sem-nada.png"
                alt="Pérola Doce - Confeitaria Artesanal"
            >

            <div class="texto-apresentacao">

                <h1>
                    CONFEITARIA ARTESANAL
                </h1>

                <p>
                    DELICADEZA EM CADA DETALHE.
                </p>

            </div>

        </section>


        <!-- ATALHOS -->
        <section class="atalhos-home">

            <a
                href="produtos.html"
                class="card-home"
            >

                <img
                    src="img/new-vitrine.png"
                    alt="Conheça nossos produtos"
                >

                <span>
                    Conheça nossos produtos
                </span>

            </a>


            <a
                href="kit-festa.html"
                class="card-home"
            >

                <img
                    src="img/new-festa-ciano.png"
                    alt="Personalize seu Kit Festa"
                >

                <span>
                    Personalize seu Kit Festa
                </span>

            </a>


            <a
                href="lojas.html"
                class="card-home"
            >

                <img
                    src="img/new-placa.png"
                    alt="Nosso espaço"
                >

                <span>
                    Nosso espaço
                </span>

            </a>

        </section>

    </main>


    <!-- CARRINHO -->
    <div
        id="painelCarrinho"
        class="painel-carrinho"
    >

        <div class="painel-carrinho-topo">

            <h2>Seu Carrinho</h2>

            <button
                id="fecharCarrinho"
                class="fechar-carrinho"
                aria-label="Fechar carrinho"
            >
                ✕
            </button>

        </div>


        <div
            id="itensCarrinho"
            class="itens-carrinho"
        ></div>


        <div class="resumo-carrinho">

            <span>Total:</span>

            <strong id="totalCarrinho">
                R$ 0,00
            </strong>

        </div>


        <button
            class="finalizar-pedido"
            id="finalizarPedido"
        >
            Finalizar pedido
        </button>

    </div>


    <script src="script.js"></script>

</body>

</html>
